name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  scope:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      application: ${{ steps.scope.outputs.application }}
    steps:
      - uses: actions/checkout@v6
        if: github.event_name == 'pull_request'
        with:
          fetch-depth: 2
      - name: Determine checks
        id: scope
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          application=true
          if [[ "$EVENT_NAME" == pull_request ]]; then
            git diff --check HEAD^1 HEAD
            if git diff --quiet HEAD^1 HEAD -- . \
              ':(top,exclude,glob)*.md' \
              ':(top,exclude,glob)docs/**/*.md' \
              ':(top,exclude,glob)skills/**/*.md' \
              ':(top,exclude,literal).github/pull_request_template.md'; then
              application=false
            else
              diff_status=$?
              if [[ "$diff_status" != 1 ]]; then
                exit "$diff_status"
              fi
            fi
          fi
          echo "application=$application" >> "$GITHUB_OUTPUT"

  application:
    needs: scope
    if: needs.scope.outputs.application == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test
      - run: pnpm build
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:e2e
      - name: Print failed browser assertions context
        if: failure()
        run: find test-results -name error-context.md -exec cat {} + 2>/dev/null || true
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: editor-screenshots
          path: test-results/**/*.png
          if-no-files-found: ignore

  compatibility:
    needs: scope
    if: needs.scope.outputs.application == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm exec playwright install --with-deps firefox webkit
      - run: pnpm exec playwright test --config playwright.compatibility.config.ts
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: browser-compatibility
          path: test-results/**/*.png
          if-no-files-found: ignore

  verify:
    needs: [scope, application, compatibility]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Confirm required checks passed
        env:
          SCOPE_RESULT: ${{ needs.scope.result }}
          RUN_APPLICATION: ${{ needs.scope.outputs.application }}
          APPLICATION_RESULT: ${{ needs.application.result }}
          COMPATIBILITY_RESULT: ${{ needs.compatibility.result }}
        run: |
          case "$SCOPE_RESULT:$RUN_APPLICATION:$APPLICATION_RESULT" in
            success:true:success:success) echo 'Application checks passed.' ;;
            success:false:skipped:skipped) echo 'Documentation-only diff passed.' ;;
            *) echo 'Required checks did not pass.'; exit 1 ;;
          esac
