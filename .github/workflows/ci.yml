name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test
      - run: pnpm build
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:e2e
      - name: Print failed browser assertions context
        if: failure()
        run: find test-results -name error-context.md -exec cat {} + 2>/dev/null || true
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: editor-screenshots
          path: test-results/**/*.png
          if-no-files-found: ignore
