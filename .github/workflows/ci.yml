name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  scope:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      application: ${{ steps.scope.outputs.application }}
    steps:
      - uses: actions/checkout@v6
        if: github.event_name == 'pull_request'
        with:
          fetch-depth: 2
      - name: Determine checks
        id: scope
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          application=true
          if [[ "$EVENT_NAME" == pull_request ]]; then
            git diff --check HEAD^1 HEAD
            if git diff --quiet HEAD^1 HEAD -- . \
              ':(top,exclude,glob)*.md' \
              ':(top,exclude,glob)docs/**/*.md' \
              ':(top,exclude,glob)skills/**/*.md' \
              ':(top,exclude,literal).github/pull_request_template.md'; then
              application=false
            else
              diff_status=$?
              if [[ "$diff_status" != 1 ]]; then
                exit "$diff_status"
              fi
            fi
          fi
          echo "application=$application" >> "$GITHUB_OUTPUT"

  application:
    needs: scope
    if: needs.scope.outputs.application == 'true'
    # Playwright's browser dependencies are validated against this image.
    # Pin it so an ubuntu-latest rollout cannot stall installs mid-release.
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test
      - run: pnpm build
      - run: pnpm --filter @vertactics/editor exec playwright install --with-deps chromium
      - run: pnpm test:e2e
      - name: Print failed browser assertions context
        if: failure()
        run: find apps/editor/test-results -name error-context.md -exec cat {} + 2>/dev/null || true
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: editor-screenshots
          path: apps/editor/test-results/**/*.png
          if-no-files-found: ignore

  compatibility:
    needs: scope
    if: needs.scope.outputs.application == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm --filter @vertactics/editor exec playwright install --with-deps firefox webkit
      - run: pnpm --filter @vertactics/editor exec playwright test --config playwright.compatibility.config.ts
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: browser-compatibility
          path: apps/editor/test-results/**/*.png
          if-no-files-found: ignore

  verify:
    needs: [scope, application, compatibility]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Confirm required checks passed
        env:
          SCOPE_RESULT: ${{ needs.scope.result }}
          RUN_APPLICATION: ${{ needs.scope.outputs.application }}
          APPLICATION_RESULT: ${{ needs.application.result }}
          COMPATIBILITY_RESULT: ${{ needs.compatibility.result }}
        run: |
          case "$SCOPE_RESULT:$RUN_APPLICATION:$APPLICATION_RESULT:$COMPATIBILITY_RESULT" in
            success:true:success:success) echo 'Application checks passed.' ;;
            success:false:skipped:skipped) echo 'Documentation-only diff passed.' ;;
            *) echo 'Required checks did not pass.'; exit 1 ;;
          esac

  build-pages:
    needs: verify
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pages: read
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
      - uses: actions/configure-pages@v5
        id: pages
      - run: pnpm install --frozen-lockfile
      - run: pnpm build --base "${PAGES_BASE%/}/"
        env:
          PAGES_BASE: ${{ steps.pages.outputs.base_path }}
      - run: test -f dist/404.html && test -f dist/favicon.png && test -f dist/social-card.png
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy-pages:
    needs: build-pages
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    outputs:
      url: ${{ steps.deployment.outputs.page_url }}
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment

  verify-public-site:
    needs: deploy-pages
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      VERTACTICS_PUBLIC_URL: ${{ needs.deploy-pages.outputs.url }}
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @vertactics/editor exec playwright install --with-deps chromium
      - run: pnpm --filter @vertactics/editor exec playwright test --config playwright.production.config.ts
